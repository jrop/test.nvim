################################################################################
## Tools
################################################################################

[tools]
"asdf:mise-plugins/mise-lua" = { version = "5.1.5", install_env = { ASDF_LUA_LUAROCKS_VERSION = "3.12.2" } }
neovim = "0.12.5"
stylua = "2.5.2"
# `mise run release` publishes through the gh CLI:
gh = "2.103.3"
cargo-binstall = "1.23.0"
"cargo:emmylua_ls" = { version = "0.25.1", depends = ["cargo-binstall"] }
"cargo:emmylua_check" = { version = "0.25.1", depends = ["cargo-binstall"] }
"github:jrop/nvim-bundle" = "0.4.0"

################################################################################
# Env
################################################################################

[env]
# busted runs its specs under `nvim -l` (see .busted), so Neovim's LuaJIT finds
# busted and luassert only through LUA_PATH and LUA_CPATH. The trailing `;;`
# keeps Lua's default search paths after the luarocks trees.
LUA_PATH = { value = "{{ exec(command='luarocks path --lr-path') }};;", tools = true }
LUA_CPATH = { value = "{{ exec(command='luarocks path --lr-cpath') }};;", tools = true }
# .emmyrc.json loads Neovim's runtime as a type library through $VIMRUNTIME. An
# editor sets it for its language server, but a shell running `emmylua_check`
# does not.
VIMRUNTIME = { value = "{{ exec(command='nvim --clean --headless +\"lua io.stdout:write(vim.env.VIMRUNTIME)\" +qa') }}", tools = true }

################################################################################
# Tasks
################################################################################

[tasks]
lint = "emmylua_check --warnings-as-errors ."
fmt = "stylua ."
"fmt:check" = "stylua --check ."

[tasks."test:prepare"]
run = "luarocks test --prepare"

[tasks.test]
depends = ["test:prepare"]
run = "busted --verbose"

[tasks."test:coverage"]
depends = ["test:prepare"]
run = '''
rm -f ./luacov.*.*
busted --coverage --verbose
luacov
awk '/^Summary$/{flag=1;next} flag{print}' luacov.report.out
'''

[tasks.ci]
run = '''
mise run fmt:check
mise run lint
mise run test
'''

[tasks.release]
description = "Publish the current v* tag as a GitHub release"
run = '''
set -eu

# `--exact-match` refuses a commit that is not itself tagged.
tag="$(git describe --tags --exact-match --match 'v*' HEAD 2>/dev/null)" || {
  echo "release: HEAD must be at a v* tag" >&2
  exit 1
}

git submodule update --init --recursive
test -z "$(git status --porcelain)" || {
  echo "release: working tree is not clean" >&2
  exit 1
}

mise run ci

# nvim-bundle defaults to `lua/` in and `dist/test.lua` out. Naming `test` as
# the entry makes the bundle return that module, which is the library's whole
# public surface, so the other modules under `lua/test/` are inlined, not
# published.
nvim-bundle build test

# Hash from inside dist so the checksum names `test.lua`.
(cd dist && shasum -a 256 test.lua > test.lua.sha256)

gh release create "$tag" \
  dist/test.lua \
  dist/test.lua.sha256 \
  --generate-notes \
  --verify-tag
'''
