################################################################################
## Tools
################################################################################

[tools]
"asdf:mise-plugins/mise-lua" = { version = "5.1.5", install_env = { ASDF_LUA_LUAROCKS_VERSION = "3.12.2" } }
neovim = "0.12.5"
stylua = "2.5.2"
# `mise run release` publishes through the gh CLI:
gh = "2.103.3"
cargo-binstall = "1.23.0"
"cargo:emmylua_ls" = { version = "0.25.1", depends = ["cargo-binstall"] }
"cargo:emmylua_check" = { version = "0.25.1", depends = ["cargo-binstall"] }
"github:jrop/nvim-bundle" = "0.2.0"

################################################################################
# Env
################################################################################

[env]
_.source = { path = "./scripts/env.sh", tools = true }

################################################################################
# Tasks
################################################################################

[tasks]
lint = "emmylua_check --warnings-as-errors --ignore '.prefix/**/*.*' ."
fmt = "stylua ."
"fmt:check" = "stylua --check ."

[tasks."test:prepare"]
run = "luarocks test --prepare"

[tasks.test]
depends = ["test:prepare"]
run = "busted --verbose"

[tasks."test:coverage"]
depends = ["test:prepare"]
run = '''
rm -f ./luacov.*.*
busted --coverage --verbose
luacov
awk '/^Summary$/{flag=1;next} flag{print}' luacov.report.out
'''

[tasks.ci]
run = '''
mise run fmt:check
mise run lint
mise run test
'''

[tasks.release]
description = "Publish the current v* tag as a GitHub release"
run = '''
set -eu

# `--exact-match` refuses a commit that is not itself tagged.
tag="$(git describe --tags --exact-match --match 'v*' HEAD 2>/dev/null)" || {
  echo "release: HEAD must be at a v* tag" >&2
  exit 1
}

git submodule update --init --recursive
test -z "$(git status --porcelain)" || {
  echo "release: working tree is not clean" >&2
  exit 1
}

mise run ci

# nvim-bundle defaults to `lua/` in and `dist/test.lua` out. The bundler
# inlines `test`, `test.nvim`, and `test.assert`, so the checkout's separate
# sources are not published alongside it.
nvim-bundle test

# Load the artifact the way a consumer will, so a bundle that does not parse or
# whose entry is incomplete fails here rather than after publication.
nvim --clean --headless \
  +"lua local b = dofile('dist/test.lua'); local t = b['test'](); assert(type(t.with_buf) == 'function', 'test.with_buf missing'); assert(type(t.Nvim.start) == 'function', 'test.nvim missing'); assert(type(b['test.assert']().deep_equal) == 'function', 'test.assert missing')" \
  +'qa!'

# Hash from inside dist so the checksum names `test.lua`.
(cd dist && shasum -a 256 test.lua > test.lua.sha256)

gh release create "$tag" \
  dist/test.lua \
  dist/test.lua.sha256 \
  --generate-notes \
  --verify-tag
'''
