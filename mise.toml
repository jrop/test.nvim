################################################################################
## Tools
################################################################################

[tools]
"asdf:mise-plugins/mise-lua" = "5.1.5"
neovim = "0.12.5"
stylua = "2.5.2"
# `mise run release` publishes through the gh CLI:
gh = "2.103.3"
cargo-binstall = "1.23.0"
"cargo:emmylua_ls" = { version = "0.25.1", depends = ["cargo-binstall"] }
"cargo:emmylua_check" = { version = "0.25.1", depends = ["cargo-binstall"] }
"github:jrop/nvim-bundle" = "0.2.0"

################################################################################
# Env
################################################################################

[env]
ASDF_LUA_LUAROCKS_VERSION = "3.12.2"
_.source = { path = "./scripts/env.sh", tools = true }

################################################################################
# Tasks
################################################################################

[tasks]
lint = "emmylua_check --warnings-as-errors --ignore '.prefix/**/*.*' ."
fmt = "stylua ."
"fmt:check" = "stylua --check ."

[tasks."test:prepare"]
run = "luarocks test --prepare"

[tasks.test]
depends = ["test:prepare"]
run = "busted --verbose"

[tasks."test:coverage"]
depends = ["test:prepare"]
run = '''
rm -f ./luacov.*.*
busted --coverage --verbose
luacov
awk '/^Summary$/{flag=1;next} flag{print}' luacov.report.out
'''

[tasks.ci]
run = '''
mise run fmt:check
mise run lint
mise run test
'''

[tasks.release]
description = "Publish the current v* tag as a GitHub release"
run = '''
set -eu

# `git describe` fails unless HEAD is exactly at a tag. Restricting the match
# to v* keeps unrelated tags from being mistaken for releases.
tag="$(git describe --tags --exact-match --match 'v*' HEAD 2>/dev/null || true)"
if [ -z "$tag" ]; then
  echo "release: HEAD must be at a v* tag" >&2
  exit 1
fi

git submodule update --init --recursive
if [ -n "$(git status --porcelain)" ]; then
  echo "release: working tree is not clean" >&2
  exit 1
fi

mise run ci

tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

# The release serves the library as one file, so a user can drop it into a
# `lua/` directory and reach every module through the bundle registry. The
# bundler inlines `test`, `test.nvim`, and `test.assert`, so the checkout's
# separate sources are not published alongside it.
nvim-bundle test --root lua --out "$tmp/test.lua"

# Load the artifact the way a consumer will, so a bundle that does not parse or
# whose entry is incomplete fails here rather than after publication.
nvim --clean --headless \
  +"lua local b = dofile('$tmp/test.lua'); local t = b['test'](); assert(type(t.with_buf) == 'function', 'test.with_buf missing'); assert(type(t.Nvim.start) == 'function', 'test.nvim missing'); assert(type(b['test.assert']().deep_equal) == 'function', 'test.assert missing')" \
  +'qa!'

(
  cd "$tmp"
  if command -v sha256sum >/dev/null 2>&1; then
    sha256sum test.lua > test.lua.sha256
  else
    shasum -a 256 test.lua > test.lua.sha256
  fi
)

# --verify-tag refuses to create a release for a tag that has not been pushed,
# which keeps the uploaded artifact tied to the tag GitHub will serve.
gh release create "$tag" \
  "$tmp/test.lua" \
  "$tmp/test.lua.sha256" \
  --title "$tag" \
  --generate-notes \
  --verify-tag

echo "published $tag"
'''
