name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Format, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The type stubs for busted and luassert live in library/busted.
          submodules: recursive

      - name: Install tools
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Run CI
        run: mise run ci
